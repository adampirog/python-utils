[project]
name = "python_utils"
authors = [
    {name = "Adam Pirog"},
    {email = "pirog.adam@gmail.com"},
]
description = "Various Python utilities."
readme = "README.md"
license = { text="MIT" }
dynamic = ["version"]
requires-python = ">=3.13"
dependencies = [
    "numpy"
    ]

[project.optional-dependencies]
dev = [
    "ruff",
    "pytest"
    ]

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["python_utils*"]

[tool.setuptools.dynamic]
version = {attr = "python_utils.version.__version__"}

[project.scripts]
clear-hidden = "python_utils.clear_hidden:cli"
python-archive = "python_utils.archives:cli"

[tool.pytest.ini_options]
minversion = "6.0"
addopts = "-ra"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
extend-select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "A",    # flake8-builtins
    "N",    # pep8-naming
    "C90",  # mccabe complexity
    "UP",   # pyupgrade
    "C4",   # flake8-comprehensions
    "RUF",  # ruff-specific rules
]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.isort]
lines-after-imports = 2